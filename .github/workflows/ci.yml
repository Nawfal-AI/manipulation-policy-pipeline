name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install numpy pytest
      - name: Run tests
        run: pytest test_env.py -v

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    # Only build/push on actual pushes to main, not on PRs from forks
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute lowercase image name
        # Docker/OCI image references must be entirely lowercase.
        # github.repository ("Nawfal-AI/manipulation-policy-pipeline")
        # contains uppercase letters, which fails tag validation immediately.
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}/policy-server:latest
            ghcr.io/${{ env.IMAGE_NAME }}/policy-server:${{ github.sha }}
