# Local test inventory — targets a Docker container pretending to be a server.
# Setup (run once on your MacBook):
#
#   docker run -d --name ansible-test \
#     -p 2222:22 \
#     -v /var/run/docker.sock:/var/run/docker.sock \
#     rastasheep/ubuntu-sshd:22.04
#
# Then run the playbook against it:
#   ansible-playbook ansible/playbook.yml -i ansible/inventory_local.ini

[ml_servers]
localhost ansible_host=127.0.0.1 ansible_port=2222 ansible_user=root ansible_ssh_pass=root ansible_ssh_common_args='-o StrictHostKeyChecking=no'
