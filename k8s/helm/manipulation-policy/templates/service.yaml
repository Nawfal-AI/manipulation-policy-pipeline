apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-policy-server
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-policy-server
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ .Release.Name }}-policy-server
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
